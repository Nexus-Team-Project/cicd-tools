name: Reusable Main CI/CD Pipeline

on:
  workflow_call:
    inputs:
      acr_name:
        required: false
        type: string
        description: 'Azure Container Registry name (if not provided, will use vars.AZURE_CONTAINER_REGISTRY)'
      resource_group:
        required: false
        type: string
        description: 'Resource group containing AKS cluster (if not provided, will use vars.RESOURCE_GROUP)'
      cluster_name:
        required: false
        type: string
        description: 'AKS cluster name (if not provided, will use vars.CLUSTER_NAME)'
      argocd_repo:
        required: false
        type: string
        description: 'ArgoCD apps repository (default: Nexus-Team-Project/argocd-apps)'
        default: 'Nexus-Team-Project/argocd-apps'
      argocd_repo_branch:
        required: false
        type: string
        description: 'ArgoCD apps repository branch (default: main)'
        default: 'main'
    secrets:
      AZURE_CLIENT_ID:
        required: true
      AZURE_TENANT_ID:
        required: true
      AZURE_SUBSCRIPTION_ID:
        required: true
      ARGOCD_REPO_TOKEN:
        required: false
        description: 'GitHub token with write access to ArgoCD repo (if not provided, will use GITHUB_TOKEN)'

permissions:
  contents: read
  id-token: write
  actions: write

jobs:
  evaluate_ci_cd_rules:
    name: Evaluate Branch Rules
    uses: ./.github/workflows/rules.yml

  orchestrate_build:
    name: Build Container Image
    needs: evaluate_ci_cd_rules
    if: needs.evaluate_ci_cd_rules.outputs.should_run_build == 'true'
    uses: ./.github/workflows/build-orchestrator.yml
    with:
      target_environment: ${{ needs.evaluate_ci_cd_rules.outputs.target_environment }}
      repo_name: ${{ github.event.repository.name }}
      image_tag: ${{ needs.evaluate_ci_cd_rules.outputs.image_tag }}
      namespace: ${{ needs.evaluate_ci_cd_rules.outputs.namespace }}
    secrets:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

  update_argocd_manifests:
    name: Update GitOps Manifests
    needs: [evaluate_ci_cd_rules, orchestrate_build]
    if: needs.evaluate_ci_cd_rules.outputs.should_run_deploy == 'true'
    uses: ./.github/workflows/update-argocd.yml
    with:
      app_name: ${{ github.event.repository.name }}
      target_environment: ${{ needs.evaluate_ci_cd_rules.outputs.target_environment }}
      image_tag: ${{ needs.evaluate_ci_cd_rules.outputs.image_tag }}
      argocd_repo: ${{ inputs.argocd_repo }}
      argocd_repo_branch: ${{ inputs.argocd_repo_branch }}
    secrets:
      ARGOCD_REPO_TOKEN: ${{ secrets.ARGOCD_REPO_TOKEN }}