# Sample workflow for testing ArgoCD pipeline - this would go in the application repository
# Uses feat/deploy-with-argo branch for testing new ArgoCD functionality
name: CI/CD Pipeline

on:
  push:
    branches: ["dev", "test-argo-pipeline"]
  pull_request:
    branches: ["main", "dev", "test-argo-pipeline"]

permissions:
  contents: read
  id-token: write
  actions: write 

jobs:
  call-full-pipeline:
    name: Run Full CI/CD Pipeline
    uses: Nexus-Team-Project/cicd-tools/.github/workflows/main.yml@feat/deploy-with-argo
    secrets: inherit
